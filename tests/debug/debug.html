<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
    <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
  </head>
  <body style="background: #1e1e1e; margin: 0; padding: 20px">
    <div id="terminal"></div>
    <hr>
    <div style="display: flex; flex-direction: column">
      <span style="color: white">State: <span id="state">offline</span></span>
      <span style="color: white">Docker log: <span id="dockerlog"></span></span>
    </div>

    <script>
      const term = new Terminal({
        cursorBlink: true,
        theme: { background: "#1e1e1e" },
        cols: 80,
        rows: 24,
      });
      term.open(document.getElementById("terminal"));
      term.writeln("Connecting..\r\n");

      const ws = new WebSocket("ws://localhost:3000/ws/testing/console");

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);

          if (msg.event === "console.output" && msg.args && msg.args[0]) {
            term.write(msg.args[0]);
          }

          if (msg.event === "state.change" && msg.args && msg.args[0]) {
            let state = document.getElementById("state")
            state.textContent = msg.args[0]
          }

          if (msg.event === "state.error" && msg.args && msg.args[0]) {
            let state = document.getElementById("state")
            state.textContent = "error (" + msg.args[0] + ")"
          }

          if (msg.event.startsWith("image.pull") && msg.args && msg.args[0]) {
            let dockerlog = document.getElementById("dockerlog")
            dockerlog.textContent = msg.args[0]
          }

        } catch (e) {
          console.error("Error while parsing:", e);
        }
      };

      ws.onclose = () => term.writeln("\r\n\x1b[31mConnection closed.\x1b[0m");
      ws.onerror = (err) =>
        term.writeln("\r\n\x1b[31mWebSocket failure!\x1b[0m");
    </script>
  </body>
</html>
